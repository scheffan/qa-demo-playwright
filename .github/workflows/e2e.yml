name: E2E (Sauce Demo)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Correr pruebas E2E
        run: npx playwright test --project=e2e

      - name: Publicar el reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e
          path: playwright-report/
          retention-days: 7

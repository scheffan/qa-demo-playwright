name: Seguridad (Juice Shop + OWASP ZAP)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Levantar OWASP Juice Shop (app de práctica, vulnerable a propósito)
        run: docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop

      - name: Esperar a que Juice Shop responda
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null; then
              echo "Juice Shop arriba."; exit 0
            fi
            echo "Esperando a Juice Shop... ($i)"; sleep 3
          done
          echo "Juice Shop no respondió a tiempo."; exit 1

      - name: Correr pruebas de seguridad (Playwright)
        env:
          JUICE_URL: http://localhost:3000
        run: npx playwright test --project=seguridad

      - name: Publicar el reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-seguridad-playwright
          path: playwright-report/
          retention-days: 7

      - name: Escaneo OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          # No falla el pipeline por hallazgos (Juice Shop es vulnerable a propósito);
          # el reporte queda como artefacto para revisarlo.
          fail_action: false
          allow_issue_writing: false
          artifact_name: reporte-zap
          cmd_options: '-a'
